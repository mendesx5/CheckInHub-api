services:
  postgres:
    image: postgres:17
    container_name: checkinhub-postgres

    environment:
      POSTGRES_DB: ${DB_NAME:-checkinhub}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - checkinhub_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkinhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: checkinhub-api

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-checkinhub}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

    ports:
      - "8080:8080"

volumes:
  checkinhub_postgres_data:
